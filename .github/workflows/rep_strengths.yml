name: Rep Strengths

on:
  schedule:
    - cron: "30 5 * * *"      # 07:30 Cairo every morning (08:30 in summer time)
  workflow_dispatch: {}        # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Read master sheet + build dashboard
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TZ: Africa/Cairo
        run: |
          rm -f Rep_Strengths_*.html Rep_Strengths_*.xlsx
          python run_github.py

      - name: Prepare GitHub Pages site (index.html = today's dashboard)
        run: |
          mkdir -p site
          cp "$(ls -t Rep_Strengths_*.html | head -1)" site/index.html
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Keep the Excel file (download from the run page — NOT published)
        uses: actions/upload-artifact@v4
        with:
          name: rep-strengths
          path: |
            Rep_Strengths_*.html
            Rep_Strengths_*.xlsx
